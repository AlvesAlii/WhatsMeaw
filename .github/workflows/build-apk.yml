name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vaultview-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: vaultview-apk
          path: vaultview-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar na release "apk"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: VaultView APK (build automático)
          body: "Gerado automaticamente no commit ${{ github.sha }}."
          files: vaultview-android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
